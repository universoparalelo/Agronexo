# Reverse proxy de producción: sirve el build estático del frontend y
# redirige /api/ al servicio FastAPI interno (nunca expuesto directo a internet).
#
# Arranca solo en HTTP (puerto 80) para que el primer deploy funcione incluso
# sin dominio todavía (solo IP pública). Una vez que el dominio apunte a la
# IP del servidor, descomentar el bloque HTTPS de abajo y correr certbot
# (ver guía de despliegue en el README).

server {
    listen 80;
    server_name _;

    client_max_body_size 3072M;  # GeoTIFF grandes (ver docker-compose.yml: bug de httptools con bodies > 2 GiB)

    # Requerido por certbot para validar el dominio antes de emitir el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;  # SPA: rutas de React Router resuelven a index.html
    }
}

