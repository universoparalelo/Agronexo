version: 2

# cooldown en cada ecosistema: espera unos días desde que una versión se
# publica antes de que Dependabot la proponga — evita adoptar de un día
# para el otro una release recién salida que resulte comprometida o rota
# (ventana en la que se detectan la mayoría de los incidentes de supply
# chain, ver Semgrep dependabot-missing-cooldown).
#
# groups: una vez por semana, un solo PR por ecosistema con todas las
# actualizaciones menores y de parche juntas. Las mayores (que pueden romper
# la API de una librería) siguen llegando de a una, para revisarlas aparte.
updates:
  # Backend + worker — ambos requirements viven en docker/
  - package-ecosystem: "pip"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      pip:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  # Frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  # Imágenes base de los Dockerfiles (node:20-slim, ghcr.io/osgeo/gdal, etc.)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # La versión de Python de la imagen se cambia a mano: 3.15 no compilaba
    # (sin ruedas de shapely ni pydantic-core, PR #173).
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"

  # El propio pipeline de CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "security"
