name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Variables compartidas entre jobs. Los valores son seguros para CI:
# no tienen acceso a producción y los servicios son efímeros.
# JWT_SECRET_KEY usa GitHub Secret cuando está disponible; cae al valor
# de prueba solo en forks o entornos sin el secret configurado.
env:
  POSTGRES_DB: agronexo_test
  POSTGRES_USER: agronexo
  POSTGRES_PASSWORD: agronexo
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/1
  MINIO_ENDPOINT: localhost:9000
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MINIO_BUCKET: agronexo
  MINIO_USE_SSL: "false"
  MINIO_PRESIGNED_URL_EXPIRY: "3600"
  JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'ci-secret-key-only-for-testing-not-production' }}
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  APP_ENV: testing
  APP_DEBUG: "false"
  ALLOWED_ORIGINS: "http://localhost:5173"

jobs:
  # ── Job 1: API — migraciones + health check ──────────────────────────────
  test-api:
    name: API — migraciones y health
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agronexo_test
          POSTGRES_USER: agronexo
          POSTGRES_PASSWORD: agronexo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agronexo -d agronexo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements.api.txt

      - name: Instalar dependencias API
        run: pip install -r docker/requirements.api.txt

      - name: Correr migraciones Alembic
        run: alembic upgrade head

      - name: Verificar que la API arranca y responde
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          curl --retry 15 --retry-delay 1 --retry-connrefused \
               -sf http://localhost:8000/api/v1/health > /dev/null
          curl -sf http://localhost:8000/api/v1/health/db > /dev/null
          echo "✓ API health OK"

      - name: Tests de validación de ingesta (API)
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_ingesta.py -v

      - name: Tests Auth JWT
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_auth.py -v

      - name: Tests CRUD Lotes y soft delete
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_lotes.py -v

      - name: Tests estado y resultado de vuelos
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_vuelos_estado.py -v

      - name: Tests motor de diagnostico (patron espacial + reglas + endpoint)
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_forma.py tests/test_diagnostico_engine.py tests/test_diagnostico_api.py -v

  # ── Job 2: Worker GIS — pipeline NDVI ────────────────────────────────────
  test-gis:
    name: Worker GIS — pipeline NDVI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.9.0

    # El worker no se conecta a Postgres ni Redis en CI (tests unitarios),
    # pero pydantic-settings requiere que las variables estén definidas.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pip y dependencias del worker
        run: |
          apt-get update -qq && apt-get install -y -qq python3-pip
          python3 -m pip install --break-system-packages --ignore-installed \
            -r docker/requirements.worker.txt

      - name: Tests pipeline NDVI
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_ndvi_pipeline.py -v

      - name: Tests índices, mapeo de bandas y reproyección
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_indices_worker.py -v

      - name: Tests validación GIS (CRS, dtype)
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_ingesta_worker.py -v

      - name: Tests clasificación dinámica y vectorización
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_clasificacion.py -v

      - name: Tests cobertura del GeoTIFF (límite de un lote sin límite)
        run: PYTHONPATH=$(pwd) python3 -m pytest tests/test_cobertura_geotiff.py -v

      - name: Tests configuración Celery
        run: |
          PYTHONPATH=$(pwd) python3 -c "
          import sys
          sys.path.insert(0, '.')
          from tests.test_celery_integracion import test_resultado_expira_en_redis, test_cola_gis_declarada
          test_resultado_expira_en_redis()
          test_cola_gis_declarada()
          print('✓ Configuración Celery OK')
          "

  # ── Job 3: Frontend — build Vite ─────────────────────────────────────────
  build-frontend:
    name: Frontend — build Vite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Build de producción
        working-directory: frontend
        run: npm run build

      - name: Verificar que el build generó archivos
        run: |
          test -f frontend/dist/index.html
          echo "✓ Build frontend OK"
